# ============================================================================
# shared — Pydantic models used by every MarketPulse service.
#
# This is a uv workspace member. Other services depend on it as:
#   [project] dependencies = ["marketplus-shared"]
#   [tool.uv.sources] marketplus-shared = { workspace = true }
#
# Keeping shared models in one place means a change to e.g. Forecast schema
# propagates to all consumers at the next `uv sync` — no version drift.
# ============================================================================

[project]
name = "marketplus-shared"
version = "0.1.0"
description = "Shared Pydantic models for MarketPulse services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplus_shared"]

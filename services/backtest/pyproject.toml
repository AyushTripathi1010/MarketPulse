# Dependencies for the backtest service ONLY.
# This service replays historical data through the agentic pipeline and
# computes performance metrics (Sharpe, max drawdown, hit rate, MAE).
#
# Why these deps and not vectorbt / backtrader / bt?
#   The popular Python backtesting libraries optimize for the *vectorized*
#   case (apply a strategy function to a whole price series at once). We
#   need WALK-FORWARD — re-run the entire agentic pipeline at each step,
#   forecasting only on data up to that point. None of the off-the-shelf
#   libraries match that shape cleanly, and writing it ourselves in ~300
#   lines of pandas is simpler than fighting their abstractions.
#
#   The interview answer: vectorized backtests are 100× faster but leak
#   information across timesteps (e.g., a strategy that uses 'mean of the
#   whole series' would secretly know the future). Walk-forward is slower
#   but cannot leak. We picked correctness over speed because we ship one
#   report per backtest, not millions of strategies per second.

[project]
name = "marketplus-backtest"
version = "0.1.0"
description = "Walk-forward backtester for MarketPulse predictions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 6 deps:
    "pandas>=2.2",                 # price-series wrangling + return calc
    "numpy>=2.0",                  # vectorized metric math
    "pyarrow>=17.0",               # read Parquet features written by data_ingest
    "httpx>=0.27",                 # call the forecast service per bar
    "matplotlib>=3.9",             # render the equity-curve PNG
    "boto3>=1.34",                 # upload reports to S3 in production
]

[project.scripts]
# Lets the user run: `uv run backtest run --ticker AAPL --from ... --to ...`
backtest = "backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

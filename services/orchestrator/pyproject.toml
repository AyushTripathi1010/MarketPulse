# Dependencies for the orchestrator service ONLY.
# This service owns the LangGraph state machine that drives the full pipeline.

[project]
name = "marketplus-orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator — the brain of MarketPulse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "marketplus-shared",
    # Phase 3 deps:
    # "langgraph>=0.2",
    # "langchain-core>=0.3",
    # "langfuse>=2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

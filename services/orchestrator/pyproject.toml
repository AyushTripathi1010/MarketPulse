# Dependencies for the orchestrator service ONLY.
# This is the BRAIN of MarketPulse — it owns the LangGraph state machine
# that walks every prediction through Data → Forecast → Critic → Report →
# Drift-check. Each node makes an HTTP call to the corresponding internal
# service. Langfuse traces every LLM step.

[project]
name = "marketplus-orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator — the brain of MarketPulse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "marketplus-shared",
    # Phase 3 deps:
    "langgraph>=0.2",              # state-machine library for agentic flows
    "langchain-core>=0.3",         # types (TypedDict helpers, Runnable)
    "langfuse>=2.40",              # LLM observability — traces every node
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

# Dependencies for the api_gateway service ONLY.
# This is the ONLY service the world (browser, Next.js frontend) hits
# directly. It authenticates requests and proxies to internal services.

[project]
name = "marketplus-api-gateway"
version = "0.1.0"
description = "Public-facing API gateway for the Next.js frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "marketplus-shared",
    # Phase 7 deps:
    # "slowapi>=0.1.9",       # rate limiting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

# Dependencies for the critic service ONLY.
# Phase 3: stub Critique with optional Groq-powered regime/confidence call.
# Phase 4 will add the fine-tuned Phi-3 regime classifier.
# Phase 5 will add hybrid RAG (Qdrant + BM25 + reranker).

[project]
name = "marketplus-critic"
version = "0.1.0"
description = "Critic Agent — regime classification + hybrid RAG + LLM judgment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 3 deps:
    "groq>=0.9",                   # fast LLM API (free tier 30 RPM)
    "tenacity>=8.5",               # retry on transient API failures
    # Phase 4 dep: HF Inference API client (no torch/transformers needed at
    # runtime — heavy ML stays on Colab; inference is one HTTP call).
    "huggingface-hub>=0.25",
    # Phase 5 deps (added when hybrid RAG lands):
    # "qdrant-client>=1.10",
    # "rank-bm25>=0.2",
    # "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critic"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

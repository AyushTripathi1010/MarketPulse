# Dependencies for the data_ingest service ONLY.
# This service pulls market data (yFinance) and news (Alpaca), cleans/joins
# it with PySpark, and writes Parquet to S3.

[project]
name = "marketplus-data-ingest"
version = "0.1.0"
description = "Market data + news ingestion service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 1 deps (added when we actually implement fetchers):
    # "yfinance>=0.2.40",
    # "alpaca-py>=0.30",
    # "pyspark>=3.5",
    # "boto3>=1.34",
    # "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_ingest"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

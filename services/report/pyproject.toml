# Dependencies for the report service ONLY.
# Phase 3: real /generate endpoint using a Jinja template, with an optional
# Groq pass that polishes the prose into something an analyst would read.

[project]
name = "marketplus-report"
version = "0.1.0"
description = "Report Agent — generates markdown intelligence briefs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 3 deps:
    "groq>=0.9",                   # optional polishing pass; LLM rewrite
    "jinja2>=3.1",                 # template renderer (deterministic body)
    "tenacity>=8.5",               # retry on transient Groq errors
    # Phase 7 (Lambda) adds boto3 for S3-write.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

# Dependencies for the report service ONLY.
# This service composes the final markdown intelligence brief using Groq.

[project]
name = "marketplus-report"
version = "0.1.0"
description = "Report Agent — generates markdown intelligence briefs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 3 deps:
    # "groq>=0.9",
    # "jinja2>=3.1",
    # "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report"]

[tool.uv.sources]
marketplus-shared = { workspace = true }

# Dependencies for the forecast service ONLY.
# This service trains and serves the Temporal Fusion Transformer.

[project]
name = "marketplus-forecast"
version = "0.1.0"
description = "TFT-based time-series forecasting service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "marketplus-shared",
    # Phase 2 deps:
    # "torch>=2.3",
    # "lightning>=2.3",
    # "pytorch-forecasting>=1.0",
    # "mlflow>=2.14",
    # "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.uv.sources]
marketplus-shared = { workspace = true }
